name: lint cask

# Guards the GENERATED Casks/peasant.rb that the Peasant release bot pushes to
# main on each final release. This mirrors the peasant repo's own split: brew
# style is the Linux-safe subset, while brew audit --cask is known-broken for
# macOS casks on Linux, so the audit runs on macOS only. Both jobs no-op cleanly
# while Casks/ is empty (before the first final release populates the tap).

on:
  push:
    branches: [main]
    paths:
      - "Casks/**"
      - ".github/workflows/lint-cask.yml"
  pull_request:
    paths:
      - "Casks/**"
      - ".github/workflows/lint-cask.yml"

permissions:
  contents: read

jobs:
  determine-runner:
    uses: peasant-labs/infra/.github/workflows/runner-router.yml@runner-router-v1
    with:
      fallback: '["ubuntu-latest"]'
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  style:
    name: brew style (linux)
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The pool image ships neither Homebrew nor the /home/linuxbrew tree the
      # hosted ubuntu image preinstalls, so the tree has to be created with the
      # right ownership before setup-homebrew adopts it. The hosted fallback
      # already has a correctly-owned tree and takes the skip branch.
      - name: Prepare the Homebrew prefix
        run: |
          set -euo pipefail
          if [ -d /home/linuxbrew ] && [ -w /home/linuxbrew ]; then
            echo "/home/linuxbrew already present and writable (hosted runner)"
            exit 0
          fi
          if [ "$(id -u)" -ne 0 ]; then
            echo "::error::cannot create /home/linuxbrew as uid $(id -u); this job needs root on the pool"
            exit 1
          fi
          mkdir -p /home/linuxbrew
          chown -R "$(id -u):$(id -g)" /home/linuxbrew
          echo "created /home/linuxbrew owned by $(id -u):$(id -g)"
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@5037c6f1012cc5ea0b9f03fedbaf9955ed9e51e0 # main
      - name: brew style the cask(s)
        run: |
          set -euo pipefail
          shopt -s nullglob
          casks=(Casks/*.rb)
          if [ ${#casks[@]} -eq 0 ]; then
            echo "Casks/ is empty — no cask to style yet (pre-first-release)."
            exit 0
          fi
          brew style "${casks[@]}"

  audit:
    name: brew audit --cask (macos)
    # brew audit --cask is known-broken on Linux; run it on macOS only. macOS
    # runners ship Homebrew preinstalled, so no setup-homebrew step is needed.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: brew audit the cask(s)
        run: |
          set -euo pipefail
          shopt -s nullglob
          casks=(Casks/*.rb)
          if [ ${#casks[@]} -eq 0 ]; then
            echo "Casks/ is empty — no cask to audit yet (pre-first-release)."
            exit 0
          fi
          # Homebrew refuses `brew audit --cask <path>` from a bare file path — a
          # cask must live in a tap. Stage into a throwaway local tap and audit
          # from there (the throwaway-tap staging idiom peasant uses on macOS).
          # Non-strict on purpose: the generated cask is kept style-clean by the
          # pinned release-tool patch, and --strict turns on new-cask cops aimed at
          # homebrew/cask submissions, not a vendor tap's generated output.
          tap="peasant-labs/cask-lint"
          brew tap-new "$tap"
          tap_dir="$(brew --repository "$tap")"
          mkdir -p "$tap_dir/Casks"
          cp "${casks[@]}" "$tap_dir/Casks/"
          for c in "${casks[@]}"; do
            token="$(basename "$c" .rb)"
            brew audit --cask "$tap/$token"
          done
